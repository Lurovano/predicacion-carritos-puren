<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel de Gestión de Turnos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .hidden-section { display: none !important; }
    </style>
</head>
<body class="text-slate-800 pb-24">

    <div class="max-w-md mx-auto min-h-screen relative flex flex-col justify-between overflow-x-hidden">
        
        <header class="bg-slate-950 text-slate-100 p-4 sticky top-0 z-50 shadow-sm border-b border-slate-800">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-lg font-semibold tracking-tight text-slate-200">Panel de Predicación Pública</h1>
                    <p class="text-xs text-slate-400 font-medium">Congregación Purén</p>
                </div>
                <span class="bg-slate-800 text-slate-300 font-medium text-[11px] px-2.5 py-1 rounded-md border border-slate-700 shadow-sm">
                    Semana Activa
                </span>
            </div>
        </header>

        <main class="p-4 flex-grow">
            
            <section id="sec-turnos" class="space-y-4">
                <div class="grid grid-cols-3 gap-2.5 bg-white p-3 rounded-xl border border-slate-200 shadow-sm text-center">
                    <div class="bg-slate-50 p-2 rounded-lg border border-slate-100">
                        <div class="text-[11px] text-rose-700 font-semibold uppercase tracking-wider">Libres</div>
                        <div id="count-libres" class="text-xl font-bold text-slate-900 mt-0.5">0</div>
                    </div>
                    <div class="bg-slate-50 p-2 rounded-lg border border-slate-100">
                        <div class="text-[11px] text-emerald-700 font-semibold uppercase tracking-wider">Asignados</div>
                        <div id="count-asignados" class="text-xl font-bold text-slate-900 mt-0.5">0</div>
                    </div>
                    <div class="bg-slate-950 p-2 rounded-lg text-slate-100">
                        <div class="text-[11px] text-slate-400 font-semibold uppercase tracking-wider">Total</div>
                        <div id="count-total" class="text-xl font-bold text-white mt-0.5">0</div>
                    </div>
                </div>

                <div class="flex items-center justify-between bg-white px-4 py-3 rounded-xl border border-slate-200 shadow-sm">
                    <div>
                        <span class="text-sm font-semibold text-slate-700">Filtro rápido de cobertura</span>
                        <p class="text-xs text-slate-400">Mostrar solo espacios disponibles</p>
                    </div>
                    <button id="toggle-vacios" class="w-11 h-6 flex items-center bg-slate-800 justify-end rounded-full p-1 transition-all duration-200">
                        <div class="bg-white w-4 h-4 rounded-full shadow-sm"></div>
                    </button>
                </div>

                <div id="container-dias" class="flex flex-wrap gap-1.5 py-1"></div>
                <div id="lista-turnos" class="space-y-3"></div>
            </section>

            <section id="sec-miturno" class="space-y-4 hidden-section">
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Consulta de Asignaciones Personales</label>
                    <input id="search-nombre" type="text" placeholder="Escribe tu nombre o apellido..." class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50 focus:bg-white focus:outline-none focus:ring-1 focus:ring-slate-800 text-sm transition-all" />
                </div>
                <div id="lista-mis-turnos" class="space-y-3"></div>
            </section>

            <section id="sec-lugares" class="space-y-4 hidden-section">
                <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm space-y-3">
                    <div>
                        <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-0.5">Ubicación Administrativa</p>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <button id="btn-pueblo-todos" class="py-2 px-1 text-xs font-semibold rounded-lg text-center bg-slate-900 text-white shadow-sm transition-all">Todos</button>
                        <button id="btn-pueblo-puren" class="py-2 px-1 text-xs font-semibold rounded-lg text-center bg-slate-50 text-slate-600 border border-slate-200 transition-all">Purén</button>
                        <button id="btn-pueblo-sauces" class="py-2 px-1 text-xs font-semibold rounded-lg text-center bg-slate-50 text-slate-600 border border-slate-200 transition-all">Los Sauces</button>
                    </div>

                    <div id="row-puntos-especificos" class="pt-3 border-t border-slate-100 hidden-section">
                        <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-0.5 mb-2">Puntos Específicos de Predicación</p>
                        <div id="container-chips-especificos" class="flex flex-wrap gap-1.5"></div>
                    </div>
                </div>

                <div id="lista-agrupada-lugares" class="space-y-4"></div>
            </section>

        </main>

        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 h-16 flex justify-around items-center z-50 px-2 shadow-xl">
            <button id="nav-turnos" class="flex flex-col items-center justify-center w-full h-full space-y-1 text-slate-950 font-semibold transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                <span class="text-[10px] tracking-wide">Turnos</span>
            </button>
            <button id="nav-miturno" class="flex flex-col items-center justify-center w-full h-full space-y-1 text-slate-400 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                <span class="text-[10px] tracking-wide">Mi Turno</span>
            </button>
            <button id="nav-lugares" class="flex flex-col items-center justify-center w-full h-full space-y-1 text-slate-400 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                <span class="text-[10px] tracking-wide">Lugares</span>
            </button>
        </nav>
    </div>

    <script>
        // CONFIGURACIÓN DE CONTACTO (¡Cambia este número por el tuyo!)
        const CONFIG_TELEFONO_ENCARGADO = "56935246020"; // <--- Pon tu número con código de país, sin el "+" ni espacios.

        const turnos = [
            { id: 1, dia: "Lunes", fecha: "16 Mar", pueblo: "Purén", lugar: "Plaza Purén", hora: "08:00 - 10:00 AM", publicadores: [] },
            { id: 2, dia: "Lunes", fecha: "16 Mar", pueblo: "Purén", lugar: "Plaza Purén", hora: "13:00 - 15:00 PM", publicadores: ["Lucia Salgado", "Fabiola de Morales"] },
            { id: 3, dia: "Lunes", fecha: "16 Mar", pueblo: "Purén", lugar: "Plaza Purén", hora: "16:00 - 18:00 PM", publicadores: [] },
            { id: 4, dia: "Lunes", fecha: "16 Mar", pueblo: "Purén", lugar: "Hospital Purén", hora: "08:00 - 10:00 AM", publicadores: [] },
            { id: 5, dia: "Lunes", fecha: "16 Mar", pueblo: "Purén", lugar: "Hospital Purén", hora: "12:00 - 14:00 PM", publicadores: ["Pedro Salgado", "Ana de Salgado"] },
            { id: 6, dia: "Lunes", fecha: "16 Mar", pueblo: "Los Sauces", lugar: "Consultorio Los Sauces", hora: "08:00 - 10:00 AM", publicadores: [] },
            { id: 7, dia: "Lunes", fecha: "16 Mar", pueblo: "Los Sauces", lugar: "Consultorio Los Sauces", hora: "12:00 - 14:00 PM", publicadores: ["Familia Urbano"] },
            { id: 8, dia: "Lunes", fecha: "16 Mar", pueblo: "Los Sauces", lugar: "Terminal Los Sauces", hora: "16:00 - 18:00 PM", publicadores: [] },
            { id: 9, dia: "Martes", fecha: "17 Mar", pueblo: "Purén", lugar: "Feria Purén", hora: "09:00 - 11:00 AM", publicadores: [] },
            { id: 10, dia: "Martes", fecha: "17 Mar", pueblo: "Purén", lugar: "Plaza Purén", hora: "11:00 - 13:00 PM", publicadores: ["Rodrigo Valdés"] },
            { id: 11, dia: "Martes", fecha: "17 Mar", pueblo: "Los Sauces", lugar: "Feria Los Sauces", hora: "10:00 - 12:00 PM", publicadores: [] },
            { id: 12, dia: "Miércoles", fecha: "18 Mar", pueblo: "Purén", lugar: "Hospital Purén", hora: "14:30 - 16:30 PM", publicadores: ["Filomena Sarabia", "Liliana de Lagos"] }
        ];

        const diasSemana = ["Todos", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
        const lugaresPorPueblo = {
            "Purén": ["Plaza Purén", "Hospital Purén", "Feria Purén"],
            "Los Sauces": ["Consultorio Los Sauces", "Feria Los Sauces", "Terminal Los Sauces"]
        };

        let filtroDia = "Todos";
        let verSoloVacios = true;
        let filtroPuebloLugares = "Todos";
        let filtroEspecificoLugar = "Todos";

        const estilosCromaticos = {
            "Purén": { border: "border-slate-500", badge: "bg-slate-100 text-slate-700 border border-slate-300", header: "bg-slate-700 text-white", activeChip: "bg-slate-700 text-white border-slate-700 font-medium" },
            "Los Sauces": { border: "border-orange-800", badge: "bg-amber-50 text-amber-900 border border-amber-200", header: "bg-orange-950 text-amber-100", activeChip: "bg-orange-900 text-white border-orange-900 font-medium" }
        };

        const elListaTurnos = document.getElementById('lista-turnos');
        const elListaMisTurnos = document.getElementById('lista-mis-turnos');
        const elListaAgrupadaLugares = document.getElementById('lista-agrupada-lugares');
        const elContainerDias = document.getElementById('container-dias');
        const elRowPuntos = document.getElementById('row-puntos-especificos');
        const elContainerChipsEspecificos = document.getElementById('container-chips-especificos');

        function actualizarContadores() {
            document.getElementById('count-total').innerText = turnos.length;
            document.getElementById('count-asignados').innerText = turnos.filter(t => t.publicadores.length > 0).length;
            document.getElementById('count-libres').innerText = turnos.filter(t => t.publicadores.length === 0).length;
        }

        function generarEnlaceWhatsApp(t) {
            const texto = `Hola, me gustaría inscribirme en el turno libre de Predicación Pública:\n\n📍 *Lugar:* ${t.lugar} (${t.pueblo})\n📅 *Día:* ${t.dia} ${t.fecha}\n⏰ *Hora:* ${t.hora};
            return `https://api.whatsapp.com/send?phone=${CONFIG_TELEFONO_ENCARGADO}&text=${encodeURIComponent(texto)}`;
        }

        function renderTurnos() {
            elListaTurnos.innerHTML = '';
            const filtrados = turnos.filter(t => {
                const matchDia = (filtroDia === "Todos" || t.dia === filtroDia);
                const matchVacio = (!verSoloVacios || t.publicadores.length === 0);
                return matchDia && matchVacio;
            });

            if(filtrados.length === 0) {
                elListaTurnos.innerHTML = '<div class="text-center py-8 text-slate-400 text-xs font-medium bg-white rounded-xl border border-slate-100 shadow-sm">No hay turnos disponibles bajo este filtro.</div>';
                return;
            }

            filtrados.forEach(t => {
                const esVacio = t.publicadores.length === 0;
                const estilo = estilosCromaticos[t.pueblo];
                const bgFondo = esVacio ? 'bg-rose-50/20 ring-1 ring-rose-100' : 'bg-white';

                let botonAccion = '';
                if (esVacio) {
                    botonAccion = `
                        <div class="mt-3 pt-3 border-t border-slate-100 flex justify-between items-center">
                            <span class="text-xs font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded">🔴 Disponible</span>
                            <a href="${generarEnlaceWhatsApp(t)}" target="_blank" class="inline-flex items-center gap-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm transition-all target-link">
                                <span>Agendar Turno</span> ➡️
                            </a>
                        </div>
                    `;
                } else {
                    botonAccion = `
                        <div class="mt-3 pt-2 border-t border-slate-100 flex items-center">
                            <span class="text-xs font-medium text-slate-500">Asignación: <span class="text-xs font-medium text-slate-800 bg-slate-50 px-1.5 py-0.5 rounded border border-slate-100">👥 ${t.publicadores.join(" y ")}</span></span>
                        </div>
                    `;
                }

                elListaTurnos.innerHTML += `
                    <div class="${bgFondo} rounded-xl border-l-4 ${estilo.border} border-y border-r border-slate-200 p-4 shadow-sm">
                        <div class="flex justify-between items-start gap-2">
                            <div>
                                <span class="text-[9px] uppercase font-bold tracking-wider px-2 py-0.5 rounded ${estilo.badge}">${t.pueblo}</span>
                                <h3 class="font-semibold text-slate-900 text-sm mt-1.5">${t.lugar}</h3>
                            </div>
                            <div class="text-right flex-shrink-0">
                                <span class="text-[11px] font-semibold text-slate-600 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded">${t.dia} ${t.fecha}</span>
                                <p class="text-[11px] text-slate-500 mt-1 font-medium">${t.hora}</p>
                            </div>
                        </div>
                        ${botonAccion}
                    </div>
                `;
            });
        }

        function renderLugaresAgrupados() {
            elListaAgrupadaLugares.innerHTML = '';

            Object.keys(lugaresPorPueblo).forEach(pueblo => {
                if (filtroPuebloLugares !== "Todos" && pueblo !== filtroPuebloLugares) return;

                lugaresPorPueblo[pueblo].forEach(lugar => {
                    if (filtroEspecificoLugar !== "Todos" && lugar !== filtroEspecificoLugar) return;

                    const turnosDelLugar = turnos.filter(t => t.lugar === lugar);
                    if (turnosDelLugar.length === 0) return;

                    const estilo = estilosCromaticos[pueblo];
                    let filasHTML = '';

                    turnosDelLugar.forEach(t => {
                        const esVacio = t.publicadores.length === 0;
                        const bgFila = esVacio ? 'bg-rose-50/10' : 'bg-white';
                        
                        let accionFila = esVacio 
                            ? `<a href="${generarEnlaceWhatsApp(t)}" target="_blank" class="text-[11px] bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold px-2 py-1 rounded">Reservar</a>` 
                            : `<span class="text-slate-700 font-medium">👥 ${t.publicadores.join(" y ")}</span>`;

                        filasHTML += `
                            <div class="p-3 flex justify-between items-center text-xs ${bgFila}">
                                <div class="space-y-0.5">
                                    <span class="font-semibold text-slate-800">${t.dia} — <span class="text-slate-500 font-normal">${t.hora}</span></span>
                                    <p class="text-slate-500 mt-0.5">${accionFila}</p>
                                </div>
                                <span class="text-[10px] bg-slate-100 text-slate-600 font-semibold px-2 py-0.5 rounded border border-slate-200">${t.fecha}</span>
                            </div>
                        `;
                    });

                    elListaAgrupadaLugares.innerHTML += `
                        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                            <div class="p-3 flex justify-between items-center ${estilo.header}">
                                <div>
                                    <h3 class="font-bold text-xs tracking-wide uppercase">${lugar}</h3>
                                    <p class="text-[9px] opacity-75 font-medium tracking-wider uppercase mt-0.5">${pueblo}</p>
                                </div>
                                <span class="text-[11px] bg-white/10 border border-white/20 px-2 py-0.5 rounded font-medium">${turnosDelLugar.length} slots</span>
                            </div>
                            <div class="divide-y divide-slate-100">${filasHTML}</div>
                        </div>
                    `;
                });
            });
        }

        function renderSubChips(pueblo) {
            elContainerChipsEspecificos.innerHTML = '';
            if (pueblo === "Todos") return;

            const btnAll = document.createElement('button');
            btnAll.innerText = "Todos los puntos";
            btnAll.className = `px-2.5 py-1 text-xs rounded-md border transition-all ${filtroEspecificoLugar === 'Todos' ? 'bg-slate-900 text-white border-slate-900 font-medium' : 'bg-slate-50 text-slate-600 border-slate-200'}`;
            btnAll.addEventListener('click', () => {
                filtroEspecificoLugar = "Todos";
                renderSubChips(pueblo);
                renderLugaresAgrupados();
            });
            elContainerChipsEspecificos.appendChild(btnAll);

            lugaresPorPueblo[pueblo].forEach(lugar => {
                const isSelected = filtroEspecificoLugar === lugar;
                const btn = document.createElement('button');
                btn.innerText = lugar.replace(" Purén", "").replace(" Los Sauces", "");
                
                if (isSelected) {
                    btn.className = `px-2.5 py-1 text-xs rounded-md border transition-all ${estilosCromaticos[pueblo].activeChip}`;
                } else {
                    btn.className = 'px-2.5 py-1 text-xs rounded-md border bg-slate-50 text-slate-600 border-slate-200 transition-all';
                }

                btn.addEventListener('click', () => {
                    filtroEspecificoLugar = lugar;
                    renderSubChips(pueblo);
                    renderLugaresAgrupados();
                });
                elContainerChipsEspecificos.appendChild(btn);
            });
        }

        function ejecutarFiltroPueblo(pueblo) {
            filtroPuebloLugares = pueblo;
            filtroEspecificoLugar = "Todos";

            document.getElementById('btn-pueblo-todos').className = `py-2 px-1 text-xs font-semibold rounded-lg text-center border transition-all ${pueblo === 'Todos' ? 'bg-slate-900 text-white border-slate-900 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200'}`;
            document.getElementById('btn-pueblo-puren').className = `py-2 px-1 text-xs font-semibold rounded-lg text-center border transition-all ${pueblo === 'Purén' ? 'bg-slate-700 text-white border-slate-700 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200'}`;
            document.getElementById('btn-pueblo-sauces').className = `py-2 px-1 text-xs font-semibold rounded-lg text-center border transition-all ${pueblo === 'Los Sauces' ? 'bg-orange-950 text-amber-100 border-orange-950 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200'}`;

            if (pueblo === "Todos") {
                elRowPuntos.classList.add('hidden-section');
            } else {
                elRowPuntos.classList.remove('hidden-section');
                renderSubChips(pueblo);
            }
            renderLugaresAgrupados();
        }

        diasSemana.forEach(dia => {
            const btn = document.createElement('button');
            btn.innerText = dia;
            btn.className = `px-3 py-1.5 text-xs font-semibold rounded-full border transition-all ${dia === 'Todos' ? 'bg-slate-900 text-white border-slate-900 shadow-sm' : 'bg-white text-slate-600 border-slate-200'}`;
            btn.addEventListener('click', () => {
                filtroDia = dia;
                Array.from(elContainerDias.children).forEach(b => b.className = 'px-3 py-1.5 text-xs font-semibold rounded-full bg-white text-slate-600 border border-slate-200');
                btn.className = 'px-3 py-1.5 text-xs font-semibold rounded-full bg-slate-900 text-white border-slate-900 shadow-sm';
                renderTurnos();
            });
            elContainerDias.appendChild(btn);
        });

        const btnToggleVacios = document.getElementById('toggle-vacios');
        btnToggleVacios.addEventListener('click', () => {
            verSoloVacios = !verSoloVacios;
            if (verSoloVacios) {
                btnToggleVacios.className = "w-11 h-6 flex items-center bg-slate-800 justify-end rounded-full p-1 transition-all duration-200";
            } else {
                btnToggleVacios.className = "w-11 h-6 flex items-center bg-slate-200 justify-start rounded-full p-1 transition-all duration-200";
            }
            renderTurnos();
        });

        const inputNombre = document.getElementById('search-nombre');
        inputNombre.addEventListener('input', () => {
            const query = inputNombre.value.trim().toLowerCase();
            elListaMisTurnos.innerHTML = '';

            if (!query) {
                elListaMisTurnos.innerHTML = '<div class="text-center py-8 text-slate-400 text-xs font-medium bg-white rounded-xl border border-slate-100 shadow-sm">Ingresa tu nombre o apellido arriba para ubicar tus turnos.</div>';
                return;
            }

            const misAsignaciones = turnos.filter(t => t.publicadores.some(p => p.toLowerCase().includes(query)));

            if (misAsignaciones.length === 0) {
                elListaMisTurnos.innerHTML = `<div class="text-center py-8 text-slate-500 font-medium text-xs bg-slate-100 border border-slate-200 rounded-xl p-4">No se registran turnos asignados esta semana para el término ingresado.</div>`;
                return;
            }

            misAsignaciones.forEach(t => {
                const estilo = estilosCromaticos[t.pueblo];
                elListaMisTurnos.innerHTML += `
                    <div class="bg-white rounded-xl border-l-4 ${estilo.border} border-y border-r border-slate-200 p-4 shadow-sm">
                        <div class="flex justify-between items-center gap-2">
                            <div>
                                <span class="text-[9px] uppercase font-bold px-2 py-0.5 rounded ${estilo.badge}">${t.pueblo}</span>
                                <h3 class="font-semibold text-slate-900 text-sm mt-1.5">${t.lugar}</h3>
                                <p class="text-xs text-slate-500 mt-0.5 font-medium">${t.hora}</p>
                            </div>
                            <div class="bg-slate-900 text-slate-100 px-3 py-2 rounded-lg text-center min-w-[70px] shadow-sm border border-slate-800">
                                <p class="text-[9px] font-bold uppercase tracking-wider text-slate-400">${t.dia}</p>
                                <p class="text-xs font-bold text-white mt-0.5">${t.fecha}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        });

        document.getElementById('btn-pueblo-todos').addEventListener('click', () => ejecutarFiltroPueblo('Todos'));
        document.getElementById('btn-pueblo-puren').addEventListener('click', () => ejecutarFiltroPueblo('Purén'));
        document.getElementById('btn-pueblo-sauces').addEventListener('click', () => ejecutarFiltroPueblo('Los Sauces'));

        const secciones = {
            'turnos': document.getElementById('sec-turnos'),
            'miturno': document.getElementById('sec-miturno'),
            'lugares': document.getElementById('sec-lugares')
        };
        const tabs = {
            'turnos': document.getElementById('nav-turnos'),
            'miturno': document.getElementById('nav-miturno'),
            'lugares': document.getElementById('nav-lugares')
        };

        Object.keys(tabs).forEach(tabId => {
            tabs[tabId].addEventListener('click', () => {
                Object.keys(secciones).forEach(id => secciones[id].classList.add('hidden-section'));
                Object.keys(tabs).forEach(id => tabs[id].className = 'flex flex-col items-center justify-center w-full h-full space-y-1 text-slate-400 transition-all');
                
                secciones[tabId].classList.remove('hidden-section');
                tabs[tabId].className = 'flex flex-col items-center justify-center w-full h-full space-y-1 text-slate-950 font-semibold transition-all';
            });
        });

        actualizarContadores();
        renderTurnos();
        renderLugaresAgrupados();
        elListaMisTurnos.innerHTML = '<div class="text-center py-8 text-slate-400 text-xs font-medium bg-white rounded-xl border border-slate-100 shadow-sm">Ingresa tu nombre o apellido arriba para ubicar tus turnos.</div>';
    </script>
</body>
</html>
