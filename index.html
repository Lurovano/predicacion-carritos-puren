            // JUEVES

            { dia: "Jueves", pueblo: "Purén", lugar: "Plaza Purén", hora: "12:00 pm - 2:00 pm" },

            { dia: "Jueves", pueblo: "Purén", lugar: "Hospital Purén", hora: "8:00 am - 10:00 am" },

            { dia: "Jueves", pueblo: "Purén", lugar: "Hospital Purén", hora: "4:00 pm - 6:00 pm" },
            { dia: "Jueves", pueblo: "Los Sauces", lugar: "Consultorio Los Sauces", hora: "8:00 am - 10:00 am" },
            { dia: "Jueves", pueblo: "Los Sauces", lugar: "Consultorio Los Sauces", hora: "12:00 pm - 2:00 pm" },
            { dia: "Jueves", pueblo: "Los Sauces", lugar: "Consultorio Los Sauces", hora: "4:00 pm - 6:00 pm" },
            { dia: "Jueves", pueblo: "Los Sauces", lugar: "Terminal Los Sauces", hora: "8:00 am - 10:00 am" },

            { dia: "Jueves", pueblo: "Los Sauces", lugar: "Terminal Los Sauces", hora: "4:00 pm - 6:00 pm" },
            // VIERNES
            { dia: "Viernes", pueblo: "Purén", lugar: "Plaza Purén", hora: "8:00 am - 10:00 am" },
            { dia: "Viernes", pueblo: "Purén", lugar: "Plaza Purén", hora: "12:00 pm - 2:00 pm" },
            { dia: "Viernes", pueblo: "Purén", lugar: "Plaza Purén", hora: "4:00 pm - 6:00 pm" },
            { dia: "Viernes", pueblo: "Purén", lugar: "Hospital Purén", hora: "8:00 am - 10:00 am" },
            { dia: "Viernes", pueblo: "Purén", lugar: "Hospital Purén", hora: "10:00 am - 1:00 pm" },

            { dia: "Viernes", pueblo: "Los Sauces", lugar: "Consultorio Los Sauces", hora: "8:00 am - 10:00 am" },
            { dia: "Viernes", pueblo: "Los Sauces", lugar: "Consultorio Los Sauces", hora: "12:00 pm - 2:00 pm" },
            { dia: "Viernes", pueblo: "Los Sauces", lugar: "Consultorio Los Sauces", hora: "4:00 pm - 6:00 pm" },
            { dia: "Viernes", pueblo: "Los Sauces", lugar: "Terminal Los Sauces", hora: "8:00 am - 10:00 am" },
            { dia: "Viernes", pueblo: "Los Sauces", lugar: "Terminal Los Sauces", hora: "12:00 pm - 2:00 pm" },
            { dia: "Viernes", pueblo: "Los Sauces", lugar: "Terminal Los Sauces", hora: "4:00 pm - 6:00 pm" },
            // SÁBADO
            { dia: "Sábado", pueblo: "Purén", lugar: "Plaza Purén", hora: "1:00 pm - 3:00 pm" },
            { dia: "Sábado", pueblo: "Purén", lugar: "Plaza Purén", hora: "3:00 pm - 5:00 pm" },
            { dia: "Sábado", pueblo: "Purén", lugar: "Plaza Purén", hora: "5:00 pm - 7:00 pm" },
            { dia: "Sábado", pueblo: "Purén", lugar: "Feria Purén", hora: "8:00 am - 10:00 am" },
            { dia: "Sábado", pueblo: "Purén", lugar: "Feria Purén", hora: "1:00 pm - 3:00 pm" },
            { dia: "Sábado", pueblo: "Los Sauces", lugar: "Consultorio Los Sauces", hora: "12:30 pm - 2:30 pm" },
            { dia: "Sábado", pueblo: "Los Sauces", lugar: "Consultorio Los Sauces", hora: "2:30 pm - 4:30 pm" },
            { dia: "Sábado", pueblo: "Los Sauces", lugar: "Consultorio Los Sauces", hora: "4:30 pm - 6:30 pm" },
            { dia: "Sábado", pueblo: "Los Sauces", lugar: "Terminal Los Sauces", hora: "12:30 pm - 2:30 pm" },
            { dia: "Sábado", pueblo: "Los Sauces", lugar: "Terminal Los Sauces", hora: "2:30 pm - 4:30 pm" },
            { dia: "Sábado", pueblo: "Los Sauces", lugar: "Terminal Los Sauces", hora: "4:30 pm - 6:30 pm" }
        ];

        const diasSemana = ["Todos", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
        
        const configPueblos = {
            "Purén": { bg: "bg-indigo-50", border: "border-indigo-600", text: "text-indigo-700", badge: "bg-indigo-100 text-indigo-800" },
            "Los Sauces": { bg: "bg-amber-50", border: "border-amber-500", text: "text-amber-700", badge: "bg-amber-100 text-amber-800" }
        };

        const lugaresPorPueblo = {
            "Purén": ["Plaza Purén", "Hospital Purén", "Feria Purén"],
            "Los Sauces": ["Consultorio Los Sauces", "Feria Los Sauces", "Terminal Los Sauces"]
        };

        function obtenerFechaDeDia(nombreDia) {
            const indicesDias = { "Lunes": 1, "Martes": 2, "Miércoles": 3, "Jueves": 4, "Viernes": 5, "Sábado": 6 };
            const objetivo = indicesDias[nombreDia];
            if (!objetivo) return "";

            const hoy = new Date();
            const diaActualSemana = hoy.getDay(); 
            const distanciaAlLunes = diaActualSemana === 0 ? -6 : 1 - diaActualSemana;
            
            const fechaResultado = new Date(hoy);
            fechaResultado.setDate(hoy.getDate() + distanciaAlLunes + (objetivo - 1));

            return `${nombreDia} ${fechaResultado.getDate()}`;
        }

        function App() {
            const [activeTab, setActiveTab] = React.useState("turnos");
            const [turnos, setTurnos] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [verSoloVacios, setVerSoloVacios] = React.useState(false); 
            const [filtroDia, setFiltroDia] = React.useState("Todos");
            const [busquedaNombre, setBusquedaNombre] = React.useState("");
            const [filtroPuebloLugares, setFiltroPuebloLugares] = React.useState("Todos");
            const [filtroEspecificoLugar, setFiltroEspecificoLugar] = React.useState("Todos");

            React.useEffect(() => {
                async function fetchTurnos() {
                    try {
                        let respuestasForm = [];
                        try {
                            // Se agrega timestamp & cache: no-cache para romper la memoria temporal del navegador
                            const timestamp = new Date().getTime();
                            const urlConAntiCache = `${SCRIPT_URL}?_=${timestamp}`;
                            
                            const response = await fetch(urlConAntiCache, { cache: "no-cache" });
                            respuestasForm = await response.json();
                        } catch (e) {
                            console.log("Error de red con el script remoto.");
                        }
                        
                        const turnosCombinados = estructuraTurnosBase.map((base, index) => {
                            const match = Array.isArray(respuestasForm) ? respuestasForm.find(r => {
                                const valorDia = r.dia || "";
                                const valorTurno = r.turno || r[base.dia] || "";
                                
                                return valorDia === base.dia && 
                                       valorTurno.includes(base.lugar) && 
                                       valorTurno.includes(base.hora);
                            }) : null;
                            
                            let publicadoresArray = [];
                            if (match) {
                                const p1 = match.publicador1 || "";
                                const p2 = match.publicador2 || "";
                                if (p1) publicadoresArray.push(p1);
                                if (p2) publicadoresArray.push(p2);
                            }

                            return {
                                id: index + 1,
                                ...base,
                                fechaTexto: obtenerFechaDeDia(base.dia),
                                publicadores: publicadoresArray
                            };
                        });

                        setTurnos(turnosCombinados);
                        setLoading(false);
                    } catch (error) {
                        console.error("Error procesando los turnos:", error);
                        setLoading(false);
                    }
                }
                fetchTurnos();
            }, []);

            React.useEffect(() => {
                setFiltroEspecificoLugar("Todos");
            }, [filtroPuebloLugares]);

            if (loading) {
                return (
                    <div class="max-w-md mx-auto bg-gray-50 min-h-screen flex flex-col justify-center items-center">
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-slate-900 mb-3"></div>
                        <p class="text-sm font-medium text-gray-500">Sincronizando con Google Sheets...</p>
                    </div>
                );
            }

            const totalTurnos = turnos.length;
            const asignados = turnos.filter(t => t.publicadores.length > 0).length;
            const libres = totalTurnos - asignados;

            return (
                <div class="max-w-md mx-auto bg-gray-50 min-h-screen pb-24 shadow-xl relative flex flex-col justify-between overflow-x-hidden">
                    
                    <header class="bg-slate-900 text-white p-4 sticky top-0 z-40 shadow-md">

                            </div>
                            <span class="bg-emerald-500 text-slate-950 font-bold text-xs px-2.5 py-1 rounded-full shadow">
                                Activo
                            </span>
                        </div>
                    </header>

                    <main class="p-4 flex-grow">
                        {activeTab === "turnos" && (
                            <div class="space-y-4">
                                <div class="grid grid-cols-3 gap-2 bg-white p-3 rounded-xl shadow-sm border border-gray-100 text-center">
                                    <div class="bg-rose-50 p-2 rounded-lg">
                                        <div class="text-xs text-rose-600 font-medium">Libres</div>
                                        <div class="text-xl font-bold text-rose-700">{libres}</div>
                                    </div>
                                    <div class="bg-emerald-50 p-2 rounded-lg">
                                        <div class="text-xs text-emerald-600 font-medium">Asignados</div>
                                        <div class="text-xl font-bold text-emerald-700">{asignados}</div>
                                    </div>
                                    <div class="bg-slate-50 p-2 rounded-lg">
                                        <div class="text-xs text-slate-600 font-medium">Total</div>
                                        <div class="text-xl font-bold text-slate-800">{totalTurnos}</div>
                                    </div>
                                </div>

                                <div class="flex items-center justify-between bg-white px-4 py-2.5 rounded-xl shadow-sm border border-gray-100">
                                    <span class="text-sm font-medium text-gray-700">Mostrar solo huecos libres</span>
                                    <button 
                                        onClick={() => setVerSoloVacios(!verSoloVacios)}
                                        class={`w-12 h-6 flex items-center rounded-full p-1 duration-300 ease-in-out ${verSoloVacios ? 'bg-rose-500 justify-end' : 'bg-gray-300 justify-start'}`}
                                    >
                                        <div class="bg-white w-4 h-4 rounded-full shadow-md transform duration-300"></div>
                                    </button>
                                </div>

                                <div class="flex flex-wrap gap-1.5 py-1">
                                    {diasSemana.map(dia => (
                                        <button
                                            key={dia}
                                            onClick={() => setFiltroDia(dia)}
                                            class={`px-3 py-1.5 text-xs font-semibold rounded-full transition-all ${
                                                filtroDia === dia 
                                                ? 'bg-slate-800 text-white shadow' 
                                                : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-100'
                                            }`}
                                        >
                                            {dia}
                                        </button>
                                    ))}
                                </div>

                                <div class="space-y-3">
                                    {turnos
                                        .filter(t => filtroDia === "Todos" || t.dia === filtroDia)
                                        .filter(t => !verSoloVacios || t.publicadores.length === 0)
                                        .map(t => {
                                            const esVacio = t.publicadores.length === 0;
                                            const cfg = configPueblos[t.pueblo] || configPueblos["Purén"];
                                            
                                            const textoMensaje = encodeURIComponent(
                                                `Hola, me gustaría solicitar el turno del ${t.fechaTexto} en ${t.lugar} de ${t.hora}.\n\n` +
                                                `-------------------------\n` +
                                                `🔗 Link de Asignación:\n${LINK_FORMULARIO}`
                                            );
                                            
                                            return (
                                                <div 
                                                    key={t.id} 
                                                    class={`bg-white rounded-xl shadow-sm border-l-4 ${cfg.border} p-4 transition-all ${esVacio ? 'ring-2 ring-rose-200/60 bg-rose-50/20' : ''}`}
                                                >
                                                    <div class="flex justify-between items-start mb-2">
                                                        <div>
                                                            <span class={`text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-md ${cfg.badge}`}>
                                                                {t.pueblo}
                                                            </span>
                                                            <h3 class="font-bold text-gray-900 mt-1">{t.lugar}</h3>
                                                        </div>
                                                        <div class="text-right">
                                                            <span class="text-xs font-bold text-slate-700 bg-slate-100 px-2 py-1 rounded-md whitespace-nowrap">
                                                                {t.fechaTexto}
                                                            </span>
                                                            <p class="text-xs text-gray-500 mt-1 font-medium">{t.hora}</p>
                                                        </div>
                                                    </div>

                                                    <div class="mt-3 pt-2 border-t border-gray-100 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                                        <div class="flex items-center space-x-1.5">
                                                            <span class="text-xs font-medium text-gray-500">Publicadores:</span>
                                                            {esVacio ? (
                                                                <span class="text-xs font-bold text-rose-600 flex items-center">
                                                                    🔴 Disponible
                                                                </span>
                                                            ) : (
                                                                <span class="text-xs font-semibold text-gray-800">
                                                                    {t.publicadores.join(" y ")}
                                                                </span>
                                                            )}
                                                        </div>
                                                        {esVacio && (
                                                            <a 
                                                                href={`https://wa.me/${MI_WHATSAPP}?text=${textoMensaje}`}
                                                                target="_blank"
                                                                class="bg-emerald-600 text-white font-bold text-[11px] px-3 py-1.5 rounded-lg shadow-sm hover:bg-emerald-700 transition-colors self-start sm:self-auto"
                                                            >
                                                                📲 Solicitar por WhatsApp
                                                            </a>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                </div>
                            </div>
                        )}

                        {activeTab === "mi-turno" && (
                            <div class="space-y-4">
                                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">
                                        Escribe tu nombre completo o apellido
                                    </label>
                                    <input 
                                        type="text"
                                        placeholder="Ej. Rodrigo Valdés"
                                        value={busquedaNombre}
                                        onChange={(e) => setBusquedaNombre(e.target.value)}
                                        class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-slate-800 text-sm"
                                    />
                                </div>

                                <div class="space-y-3">
                                    {busquedaNombre.trim() === "" ? (
                                        <div class="text-center py-8 text-gray-400 text-sm">
                                            Ingresa tu nombre arriba para mapear tus asignaciones de la semana.
                                        </div>
                                    ) : (
                                        (() => {
                                            const misAsignaciones = turnos.filter(t => 
                                                t.publicadores.some(p => p.toLowerCase().includes(busquedaNombre.toLowerCase()))
                                            );

                                            if (misAsignaciones.length === 0) {
                                                return (
                                                    <div class="text-center py-8 text-rose-500 font-medium text-sm bg-rose-50 rounded-xl p-4">
                                                        No se encontraron turnos asignados para "{busquedaNombre}".
                                                    </div>
                                                );
                                            }

                                            return misAsignaciones.map(t => {
                                                const cfg = configPueblos[t.pueblo] || configPueblos["Purén"];
                                                return (
                                                    <div key={t.id} class={`bg-white rounded-xl shadow-sm border-l-4 ${cfg.border} p-4`}>
                                                        <div class="flex justify-between items-center">
                                                            <div>
                                                                <span class={`text-[10px] uppercase font-bold px-2 py-0.5 rounded-md ${cfg.badge}`}>
                                                                    {t.pueblo}
                                                                </span>
                                                                <h3 class="font-bold text-gray-900 mt-1">{t.lugar}</h3>
                                                                <p class="text-xs text-gray-500 mt-0.5">{t.hora}</p>
                                                            </div>
                                                            <div class="bg-slate-900 text-white px-3 py-2 rounded-lg text-center min-w-[90px]">
                                                                <p class="text-[9px] font-bold uppercase tracking-wide text-slate-400">Fecha</p>
                                                                <p class="text-xs font-black whitespace-nowrap">{t.fechaTexto}</p>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            });
                                        })()
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === "lugares" && (
                            <div class="space-y-4">
                                <div class="bg-white p-2.5 rounded-xl shadow-sm border border-gray-100 space-y-2">
                                    <p class="text-[10px] font-bold uppercase tracking-wider text-gray-400 px-1">Filtrar por Pueblo</p>
                                    <div class="grid grid-cols-3 gap-1.5">
                                        {["Todos", "Purén", "Los Sauces"].map(pueblo => {
                                            let btnStyle = "bg-gray-100 text-gray-600";
                                            if (filtroPuebloLugares === pueblo) {
                                                if (pueblo === "Todos") btnStyle = "bg-slate-800 text-white shadow";
                                                if (pueblo === "Purén") btnStyle = "bg-indigo-600 text-white shadow";
                                                if (pueblo === "Los Sauces") btnStyle = "bg-amber-500 text-white shadow";
                                            }
                                            return (
                                                <button
                                                    key={pueblo}
                                                    onClick={() => setFiltroPuebloLugares(pueblo)}
                                                    class={`py-2 px-1 text-xs font-bold rounded-lg text-center transition-all ${btnStyle}`}
                                                >
                                                    {pueblo}
                                                </button>
                                            );
                                        })}
                                    </div>

                                    {filtroPuebloLugares !== "Todos" && (
                                        <div class="pt-2 border-t border-gray-100">
                                            <p class="text-[10px] font-bold uppercase tracking-wider text-gray-400 px-1 mb-1.5">Puntos específicos</p>
                                            <div class="flex flex-wrap gap-1">
                                                <button
                                                    onClick={() => setFiltroEspecificoLugar("Todos")}
                                                    class={`px-2.5 py-1 text-xs font-medium rounded-md border ${
                                                        filtroEspecificoLugar === "Todos"
                                                        ? 'bg-slate-700 text-white border-slate-700'
                                                        : 'bg-white text-gray-600 border-gray-200'
                                                    }`}
                                                >
                                                    Todos los puntos
                                                </button>
                                                {lugaresPorPueblo[filtroPuebloLugares].map(lugar => {
                                                    const isSelected = filtroEspecificoLugar === lugar;
                                                    const isPuren = filtroPuebloLugares === "Purén";
                                                    const activeChipClass = isPuren ? 'bg-indigo-100 text-indigo-900 border-indigo-400 font-bold' : 'bg-amber-100 text-amber-900 border-amber-400 font-bold';
                                                    
                                                    return (
                                                        <button
                                                            key={lugar}
                                                            onClick={() => setFiltroEspecificoLugar(lugar)}
                                                            class={`px-2.5 py-1 text-xs rounded-md border transition-all ${
                                                                isSelected ? activeChipClass : 'bg-white text-gray-600 border-gray-200'
                                                            }`}
                                                        >
                                                            {lugar.replace(" Purén", "").replace(" Los Sauces", "")}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div class="space-y-4">
                                    {Object.keys(lugaresPorPueblo)
                                        .filter(p => filtroPuebloLugares === "Todos" || p === filtroPuebloLugares)
                                        .map(pueblo => {
                                            return lugaresPorPueblo[pueblo]
                                                .filter(l => filtroEspecificoLugar === "Todos" || l === filtroEspecificoLugar)
                                                .map(lugar => {
                                                    const turnosDelLugar = turnos.filter(t => t.lugar === lugar);
                                                    if (turnosDelLugar.length === 0) return null;

                                                    return (
                                                        <div key={lugar} class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                                                            <div class={`p-3 flex justify-between items-center ${pueblo === 'Purén' ? 'bg-indigo-900 text-white' : 'bg-amber-600 text-white'}`}>
                                                                <div>
                                                                    <h3 class="font-bold text-sm tracking-tight">{lugar}</h3>
                                                                    <p class="text-[10px] opacity-80">{pueblo}</p>
                                                                </div>
                                                                <span class="text-xs bg-white/20 px-2 py-0.5 rounded-full font-bold">
                                                                    {turnosDelLugar.length} turnos
                                                                </span>
                                                            </div>

                                                            <div class="divide-y divide-gray-100">
                                                                {turnosDelLugar.map(t => {
                                                                    const esVacio = t.publicadores.length === 0;
                                                                    return (
                                                                        <div key={t.id} class={`p-3 flex justify-between items-center text-xs ${esVacio ? 'bg-rose-50/40' : ''}`}>
                                                                            <div class="space-y-0.5">
                                                                                <span class="font-bold text-slate-800">{t.fechaTexto} ({t.hora})</span>
                                                                                <div class="text-gray-500">
                                                                                    {esVacio ? (
                                                                                        <span class="text-rose-600 font-bold">🔴 Falta Asignar</span>
                                                                                    ) : (
                                                                                        <span>👥 {t.publicadores.join(" y ")}</span>
                                                                                    )}
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    );
                                                });
                                        })}
                                </div>
                            </div>
                        )}
                    </main>

                    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 h-16 flex justify-around items-center z-50 px-2 shadow-2xl">
                        <button onClick={() => setActiveTab("turnos")} class={`flex flex-col items-center justify-center w-full h-full space-y-0.5 ${activeTab === "turnos" ? 'text-slate-900 font-bold' : 'text-gray-400'}`}>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                            <span class="text-[10px]">Turnos</span>
                        </button>
                        <button onClick={() => setActiveTab("mi-turno")} class={`flex flex-col items-center justify-center w-full h-full space-y-0.5 ${activeTab === "mi-turno" ? 'text-slate-900 font-bold' : 'text-gray-400'}`}>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                            <span class="text-[10px]">Mi Turno</span>
                        </button>
                        <button onClick={() => setActiveTab("lugares")} class={`flex flex-col items-center justify-center w-full h-full space-y-0.5 ${activeTab === "lugares" ? 'text-slate-900 font-bold' : 'text-gray-400'}`}>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                            <span class="text-[10px]">Lugares</span>
                        </button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
